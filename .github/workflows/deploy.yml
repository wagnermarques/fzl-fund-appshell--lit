# Publica o appshell no GitHub Pages a cada push no main.
# URL: https://wagnermarques.github.io/fzl-fund-appshell--lit/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build static PWA
        env:
          VITE_APPSHELL_TITLE: ${{ vars.VITE_APPSHELL_TITLE }}
          VITE_APPSHELL_BACKENDS_API_URL: ${{ vars.VITE_APPSHELL_BACKENDS_API_URL }}
          VITE_APPSHELL_ANALYTICS_ID: ${{ vars.VITE_APPSHELL_ANALYTICS_ID }}
          VITE_APPSHELL_PUSH_VAPID_PUBLIC_KEY: ${{ vars.VITE_APPSHELL_PUSH_VAPID_PUBLIC_KEY }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
